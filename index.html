    <button class="exitBtn" onclick="goHomeFromLesson()" style="margin-bottom:10px">‹ Về trang chính</button>
    <h2>${L.titleVi}</h2>
    <p class="lead" style="opacity:.75;margin-top:-8px">${L.title}</p>
    <div class="readAllCard" id="readAllPanel">${renderReadAllButtons(key)}</div>
    <p class="small" style="text-align:left;margin:12px 0 10px">💡 Bấm 🔊 để nghe từng đoạn riêng, bấm 🖼 để xem hình minh hoạ (nếu có).</p>
    ${secHtml}
  </div>
  <div class="card kwcard">
    <h2>🔑 Tóm tắt từ khoá cần nhớ</h2>
    ${kwHtml}
  </div>
  <div class="card">
    <h2>🧠 Sơ đồ tư duy (Mind map)</h2>
    <div class="mindmapBox">${renderMindMap(key)}</div>
  </div>
  <div class="card" style="text-align:center">
    <button class="btn" onclick="stopReadAll();startPractice('${key}')">Luyện quiz phần này ›</button>
    <button class="btn ghost" onclick="goHomeFromLesson()">‹ Về trang chính</button>
  </div>`;
  window.scrollTo(0,0);
}

function goHomeFromLesson(){
  stopReadAll();
  home();
}


function startExam(){
  // 20 questions: 5 values (mandatory) + 15 from others, mimic real test
  const values=pick(QUESTIONS.filter(q=>q.cat==='values'),5);
  const others=pick(QUESTIONS.filter(q=>q.cat!=='values'),15);
  const qs=shuffle(values.concat(others));
  session={mode:'exam',qs,i:0,answers:{},timeLeft:45*60,startedTimer:false};
  runQuestion();
  startTimer();
}
function startQuick(){
  const qs=pick(QUESTIONS,10);
  session={mode:'practice',qs,i:0,answers:{}};
  runQuestion();
}
function startValues(){
  const qs=pick(QUESTIONS.filter(q=>q.cat==='values'),Math.min(15,catCount('values')));
  session={mode:'practice',qs,i:0,answers:{},title:'⭐ Values'};
  runQuestion();
}
function startPractice(cat){
  const qs=pick(QUESTIONS.filter(q=>q.cat===cat),QUESTIONS.filter(q=>q.cat===cat).length);
  session={mode:'practice',qs,i:0,answers:{},title:CATS[cat].vi,cat};
  runQuestion();
}

// =================== TIMER (exam) ===================
let timerHandle=null;
function startTimer(){
  clearInterval(timerHandle);
  timerHandle=setInterval(()=>{
    if(!session||session.mode!=='exam'){clearInterval(timerHandle);return;}
    session.timeLeft--;
    const el=document.getElementById('timer');
    if(el){
      const mm=Math.floor(session.timeLeft/60), ss=session.timeLeft%60;
      el.textContent=`${mm}:${ss<10?'0':''}${ss}`;
      el.className='timer'+(session.timeLeft<=120?' warn':'');
    }
    if(session.timeLeft<=0){clearInterval(timerHandle);finishExam();}
  },1000);
}

// =================== RENDER QUESTION ===================
function runQuestion(){
  const s=session, q=s.qs[s.i];
  const answered=s.answers[q.id]!==undefined;
  const isExam=s.mode==='exam';
  const catLabel=CATS[q.cat].en;
  let optsHtml='';
  q.options.forEach((opt,idx)=>{
    let cls='opt';
    if(answered){
      if(idx===q.answer)cls+=' correct';
      else if(idx===s.answers[q.id])cls+=' wrong';
      else cls+=' dim';
    }
    optsHtml+=`<button class="${cls}" ${answered?'disabled':''} onclick="answer(${idx})">
      <span class="lab">${String.fromCharCode(65+idx)}</span>${opt}</button>`;
  });

  let expHtml='';
  if(answered && !isExam){
    const correct=s.answers[q.id]===q.answer;
    expHtml=`<div class="exp show ${correct?'':'bad'}">
      <span class="tag">${correct?'✓ Đúng — Giải thích':'✗ Chưa đúng — Giải thích'}</span>
      ${q.exp}</div>`;
  }

  const timerBar=isExam?`<span class="timer" id="timer">45:00</span>`:`<span>${s.title||'Luyện tập'}</span>`;
  const isLast=s.i===s.qs.length-1;
  const allAnswered=s.qs.every(qq=>s.answers[qq.id]!==undefined);

  let nav='';
  if(isExam){
    nav=`<div class="navrow">
      ${s.i>0?`<button class="btn ghost sm" onclick="go(-1)">‹ Trước</button>`:''}
      ${!isLast?`<button class="btn sm" onclick="go(1)">Sau ›</button>`:
        `<button class="btn sm" onclick="finishExam()" style="background:#c9a227">Nộp bài</button>`}
    </div>
    <p class="small">Đã trả lời ${Object.keys(s.answers).length}/20 · có thể bỏ qua và quay lại</p>`;
  }else{
    if(answered){
      nav=`<div class="navrow">
        ${!isLast?`<button class="btn sm" onclick="go(1)">Câu tiếp ›</button>`:
          `<button class="btn sm" onclick="finishPractice()">Xem kết quả</button>`}
      </div>`;
    }else{
      nav=`<p class="small">Chọn một đáp án để xem giải thích</p>`;
    }
  }

  app.innerHTML=`
  <div class="card">
    <div class="qmeta">
      <button class="exitBtn" onclick="exitQuiz()">✕ Thoát</button>
      <span style="display:flex;gap:8px;align-items:center">${timerBar}<span>· Câu ${s.i+1}/${s.qs.length}</span></span>
    </div>
    <span class="pill ${q.cat==='values'?'values':''}">${catLabel}${q.cat==='values'?' ★':''}</span>
    <div class="qtext">${q.q}</div>
    ${optsHtml}
    ${expHtml}
    ${nav}
  </div>`;
  window.scrollTo(0,0);
}

function answer(idx){
  const s=session,q=s.qs[s.i];
  if(s.answers[q.id]!==undefined)return;
  s.answers[q.id]=idx;
  const m=store.get();
  m.seen[q.id]=true;
  if(idx===q.answer)m.correct[q.id]=true;
  store.save(m);
  if(s.mode==='exam'){
    // auto-advance feel: just re-render (no explanation in exam)
    if(s.i<s.qs.length-1){s.i++;runQuestion();}
    else runQuestion();
  }else{
    runQuestion();
  }
}
function go(d){
  const s=session;
  s.i=Math.max(0,Math.min(s.qs.length-1,s.i+d));
  runQuestion();
}

function exitQuiz(){
  const s=session;
  const answered=Object.keys(s.answers).length;
  const msg = s.mode==='exam'
    ? `Thoát bài thi thử? Bạn đã trả lời ${answered}/${s.qs.length} câu.\nBài thi sẽ KHÔNG được lưu nếu bạn thoát bây giờ.`
    : `Thoát luyện tập? Bạn đã trả lời ${answered}/${s.qs.length} câu.\nCác câu đã đúng vẫn được lưu vào tiến độ.`;
  if(confirm(msg)){
    clearInterval(timerHandle);
    if('speechSynthesis' in window) window.speechSynthesis.cancel();
    session=null;
    window.close();
    // If the browser blocks window.close() (tab wasn't opened by script),
    // show a clear "you can close this tab" screen instead of silently doing nothing.
    setTimeout(()=>{
      app.innerHTML=`
      <div class="card" style="text-align:center">
        <h2>Đã thoát</h2>
        <p class="lead">Bạn có thể đóng tab/trang này ngay bây giờ.</p>
        <p class="small">(Trình duyệt không cho phép tự động đóng tab này — vui lòng đóng thủ công.)</p>
      </div>`;
    },150);
  }
}

// =================== RESULTS ===================
function finishPractice(){
  const s=session;
  const total=s.qs.length;
  const correct=s.qs.filter(q=>s.answers[q.id]===q.answer).length;
  const pct=Math.round(correct/total*100);
  let review='';
  s.qs.forEach((q,n)=>{
    const you=s.answers[q.id], ok=you===q.answer;
    review+=`<div class="review-q">${n+1}. ${q.q} <span class="badge">${ok?'✓':'✗'}</span></div>`;
    if(!ok){
      review+=`<div class="review-a you">Bạn chọn: ${String.fromCharCode(65+you)}. ${q.options[you]}</div>`;
      review+=`<div class="review-a corr">Đúng: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}</div>`;
      review+=`<div class="exp show" style="margin-top:6px">${q.exp}</div>`;
    }
  });
  app.innerHTML=`
  <div class="card">
    <h2>Kết quả luyện tập</h2>
    <div class="score-big">${correct}/${total}</div>
    <div class="score-lbl">${pct}% đúng</div>
    <button class="btn" onclick="home()">‹ Về trang chính</button>
  </div>
  <div class="card"><h2>Xem lại câu sai</h2>
    ${s.qs.filter(q=>s.answers[q.id]!==q.answer).length===0?'<p class="lead">🎉 Bạn trả lời đúng hết! Xuất sắc.</p>':review}
  </div>`;
  window.scrollTo(0,0);
}

function finishExam(){
  clearInterval(timerHandle);
  const s=session;
  // fill unanswered as wrong
  const valuesQs=s.qs.filter(q=>q.cat==='values');
  const valuesCorrect=valuesQs.filter(q=>s.answers[q.id]===q.answer).length;
  const totalCorrect=s.qs.filter(q=>s.answers[q.id]===q.answer).length;
  const passOverall=totalCorrect>=15;
  const passValues=valuesCorrect===valuesQs.length && valuesQs.length>0;
  const passed=passOverall&&passValues;

  const m=store.get();
  m.examCount++;
  if(m.bestExam==null||totalCorrect>m.bestExam)m.bestExam=totalCorrect;
  store.save(m);

  // per category
  const byCat={};
  s.qs.forEach(q=>{
    byCat[q.cat]=byCat[q.cat]||{c:0,t:0};
    byCat[q.cat].t++;
    if(s.answers[q.id]===q.answer)byCat[q.cat].c++;
  });
  let catRows='';
  for(const c in byCat){
    catRows+=`<div class="rescat"><span>${CATS[c].vi}</span><b>${byCat[c].c}/${byCat[c].t}</b></div>`;
  }

  let review='';
  s.qs.forEach((q,n)=>{
    const you=s.answers[q.id];
    const ok=you===q.answer;
    review+=`<div class="review-q">${n+1}. ${q.q} <span class="badge" style="${q.cat==='values'?'background:#fbeecf;color:#8a6d12':''}">${ok?'✓':'✗'}${q.cat==='values'?' ★':''}</span></div>`;
    if(!ok){
      review+=`<div class="review-a you">Bạn chọn: ${you!==undefined?String.fromCharCode(65+you)+'. '+q.options[you]:'(bỏ trống)'}</div>`;
      review+=`<div class="review-a corr">Đúng: ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}</div>`;
      review+=`<div class="exp show" style="margin-top:6px">${q.exp}</div>`;
    }
  });

  app.innerHTML=`
  <div class="card">
    <h2>Kết quả Thi thử</h2>
    <div class="score-big">${totalCorrect}/20</div>
    <div class="score-lbl">${Math.round(totalCorrect/20*100)}% · Values ${valuesCorrect}/${valuesQs.length}</div>
    <div class="verdict ${passed?'pass':'fail'}">${passed?'✓ ĐẬU (PASS)':'✗ CHƯA ĐẬU (FAIL)'}</div>
    <div class="stat"><span>Tổng thể (cần ≥15/20)</span><b style="color:${passOverall?'#2e8b57':'#c0392b'}">${passOverall?'Đạt':'Chưa đạt'} — ${totalCorrect}/20</b></div>
    <div class="stat"><span>Values (cần 5/5)</span><b style="color:${passValues?'#2e8b57':'#c0392b'}">${passValues?'Đạt':'Chưa đạt'} — ${valuesCorrect}/${valuesQs.length}</b></div>
    ${!passValues?'<p class="small" style="color:#c0392b">⚠ Sai phần Values là tự động rớt, dù tổng điểm cao. Hãy luyện lại phần ⭐ Values.</p>':''}
    <button class="btn" style="margin-top:12px" onclick="startExam()">🔁 Thi lại</button>
    <button class="btn alt" onclick="home()">‹ Về trang chính</button>
  </div>
  <div class="card"><h2>Điểm theo phần</h2>${catRows}</div>
  <div class="card"><h2>Xem lại câu sai</h2>
    ${s.qs.filter(q=>s.answers[q.id]!==q.answer).length===0?'<p class="lead">🎉 Đúng cả 20 câu — hoàn hảo!</p>':review}
  </div>`;
  window.scrollTo(0,0);
}

home();
</script>
